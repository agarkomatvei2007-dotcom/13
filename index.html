    const ViewModal = ({ m, onClose, onAddComment, onDelete, onToast }) => {
      const [ca,setCa] = useState('');
      const [ct,setCt] = useState('');
      const meta = catMeta(m.category);
      const st = CAT_STYLES[meta.color] || CAT_STYLES.graphite;
      const comments = (m.comments||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));

      const submitComment = (e)=>{
        e.preventDefault();
        if(!ca.trim()||!ct.trim()) return;
        onAddComment(m.id, ca.trim(), ct.trim());
        setCa(''); setCt('');
      };
      const downloadTxt = ()=>{
        const blob=new Blob([buildTextDump(m)],{type:'text/plain;charset=utf-8'});
        const url=URL.createObjectURL(blob); const a=document.createElement('a');
        const safe=m.title.replace(/[^\p{L}\p{N}]+/gu,'_').slice(0,50);
        a.href=url; a.download=(safe||'material')+'.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        onToast('Файл TXT скачан','fa-download');
      };
      const copyText = async ()=>{
        try { await navigator.clipboard.writeText(buildTextDump(m)); onToast('Текст скопирован в буфер','fa-copy'); }
        catch {
          const ta=document.createElement('textarea'); ta.value=buildTextDump(m); ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select();
          try{ document.execCommand('copy'); onToast('Текст скопирован','fa-copy'); }catch{ onToast('Не удалось скопировать','fa-triangle-exclamation'); }
          ta.remove();
        }
      };

      return (
        <ModalShell onClose={onClose} max="max-w-3xl">

                <span className="inline-flex items-center gap-1 text-xs font-semibold text-graphite-500"><i className="fa-solid fa-location-dot text-sky-500"></i> {m.district}</span>
              </div>
              <h3 className="font-display text-2xl font-extrabold text-graphite-900 leading-tight">{m.title}</h3>
            </div>
            <button onClick={onClose} className="shrink-0 w-10 h-10 rounded-xl hover:bg-graphite-50 grid place-items-center text-graphite-500 transition"><i className="fa-solid fa-xmark text-lg"></i></button>
          </div>

          <div className="px-6 py-6">
            <div className="flex items-center gap-3 mb-5">
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-sky-400 to-sky-600 grid place-items-center text-white text-sm font-bold">{initials(m.author)}</div>
              <div>
                <p className="text-sm font-bold text-graphite-800">{m.author}</p>
                <p className="text-xs text-graphite-500"><i className="fa-regular fa-calendar"></i> {formatDate(m.date)}</p>
              </div>
            </div>

            <div className="rounded-2xl bg-sky-50/70 border border-sky-100 p-4 mb-5">
              <p className="text-sm text-sky-900/80 font-medium italic">{m.summary}</p>
            </div>

            <div className="whitespace-pre-wrap text-graphite-700 leading-relaxed text-[15px]">{m.content}</div>

            <div className="mt-6 flex flex-wrap gap-3">
              <button onClick={downloadTxt} className="inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-sky-600 text-white font-bold text-sm hover:bg-sky-700 transition shadow-lg shadow-sky-600/20"><i className="fa-solid fa-download"></i> Скачать в TXT</button>
              <button onClick={copyText} className="inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-graphite-100 text-graphite-700 font-bold text-sm hover:bg-graphite-200 transition"><i className="fa-regular fa-copy"></i> Копировать текст</button>
              <button onClick={()=>onDelete(m.id)} className="inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-red-50 text-red-600 font-bold text-sm hover:bg-red-100 transition ml-auto"><i className="fa-regular fa-trash-can"></i> Удалить</button>
            </div>

            <HornDivider className="mt-8" />

            <div className="mt-6">
              <h4 className="font-display text-lg font-bold text-graphite-900 flex items-center gap-2">

                <span className="text-sm font-semibold text-graphite-400">({comments.length})</span>

                        <p className="text-sm text-graphite-600 mt-0.5">{c.text}</p>
                      </div>
                    </div>
                  ))}
              </div>
            </div>
          </div>
        </ModalShell>
      );
    };

          <div className="text-center mb-10">
            <HornDivider className="max-w-xs mx-auto mb-6" />
            <h2 className="font-display text-3xl font-extrabold text-graphite-900">О проекте «Шаңырақ»</h2>
            <p className="mt-2 text-graphite-500 max-w-2xl mx-auto">Шаңырақ — купол юрты и символ единства семьи. Мы объединяем наследие Прииртышья под одним сводом.</p>
          </div>
          <div className="grid md:grid-cols-3 gap-5">
            {[
              {icon:'fa-hand-holding-heart',cls:'bg-sky-100 text-sky-700',t:'Сақтаймыз · Сохраняем',d:'Каждый материал — частица живого наследия Павлодарского Прииртышья для будущих поколений.'},
              {icon:'fa-people-group',cls:'bg-sand-100 text-sand-700',t:'Бөлісеміз · Делимся',d:'Педагоги и краеведы делятся сценариями, обсуждают и дополняют материалы коллег.'},
              {icon:'fa-download',cls:'bg-graphite-100 text-graphite-700',t:'Қолжетімді · Доступно',d:'Скачивайте материалы в TXT, копируйте сценарии — данные хранятся прямо в вашем браузере.'},
            ].map(c=>(
              <div key={c.t} className="rounded-3xl bg-white border border-graphite-100 p-6 shadow-sm hover:shadow-lg transition">
                <div className={"w-12 h-12 rounded-2xl grid place-items-center text-xl "+c.cls}><i className={"fa-solid "+c.icon}></i></div>
                <h3 className="mt-4 font-bold text-lg text-graphite-900">{c.t}</h3>
                <p className="mt-1 text-graphite-500 text-sm">{c.d}</p>
              </div>
            ))}
          </div>

          {/* лента пословиц */}
          <div className="mt-10 grid sm:grid-cols-2 gap-4">
            {PROVERBS.map((p,i)=>(
              <div key={i} className="rounded-2xl bg-gradient-to-br from-sky-700 to-sky-900 text-white p-5 shadow-lg overflow-hidden relative">
                <ShanyrakIcon className="absolute -right-6 -bottom-6 w-24 h-24 text-white/10" />
                <p className="font-display text-lg font-bold">«{p.kz}»</p>
                <p className="text-sky-100/80 text-sm mt-1">{p.ru}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    /* ============================================================
       ПОДВАЛ
    ============================================================ */
    const Footer = ({ onReset }) => (
      <footer className="bg-graphite-900 text-sky-100/70">
        <div className="ornament-band h-6 opacity-60"></div>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-sky-700 grid place-items-center text-white"><ShanyrakIcon className="w-5 h-5"/></div>
            <div>
              <p className="font-display font-bold text-white">Шаңырақ</p>
              <p className="text-xs">Методическая копилка · Павлодарская область</p>
            </div>
          </div>
          <p className="text-xs text-center sm:text-right">
            Локальное React-приложение · данные хранятся в вашем браузере (localStorage)<br/>
            <button onClick={onReset} className="mt-1 underline hover:text-white transition">Сбросить к примерам</button>
          </p>
        </div>
      </footer>
    );

    /* ============================================================
       КОРНЕВОЙ КОМПОНЕНТ
    ============================================================ */
    const App = () => {
      const [materials,setMaterials] = useState(loadData);
      const [query,setQuery] = useState('');
      const [district,setDistrict] = useState('');
      const [category,setCategory] = useState('');
      const [showAdd,setShowAdd] = useState(false);
      const [viewId,setViewId] = useState(null);
      const [toast,setToast] = useState(null);
      const toastTimer = useRef(null);

      useEffect(()=>{ saveData(materials); },[materials]);

      const showToast = (msg,icon='fa-circle-check')=>{
        setToast({msg,icon});
        clearTimeout(toastTimer.current);
        toastTimer.current=setTimeout(()=>setToast(null),2600);
      };

      const stats = useMemo(()=>({
        materials: materials.length,
        districts: new Set(materials.map(m=>m.district)).size,
        comments: materials.reduce((s,m)=>s+(m.comments?.length||0),0),
      }),[materials]);

      const filtered = useMemo(()=>{
        const q=query.trim().toLowerCase();
        return materials.filter(m=>{
          const mq=!q || m.title.toLowerCase().includes(q) || (m.summary||'').toLowerCase().includes(q) || (m.author||'').toLowerCase().includes(q);
          const md=!district || m.district===district;
          const mc=!category || m.category===category;
          return mq&&md&&mc;
        }).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
      },[materials,query,district,category]);

      const viewItem = materials.find(m=>m.id===viewId) || null;

      const handleAdd = (f)=>{
        const item={ id:uid(), title:f.title.trim(), author:f.author.trim(), district:f.district, category:f.category, summary:f.summary.trim(), content:f.content.trim(), date:new Date().toISOString(), comments:[] };
        setMaterials(prev=>[...prev,item]);
        setShowAdd(false);
        setQuery(''); setDistrict(''); setCategory('');
        showToast('Материал опубликован в копилку!','fa-circle-check');
        setTimeout(()=>document.getElementById('lenta')?.scrollIntoView({behavior:'smooth'}),60);
      };
      const handleAddComment = (id,author,text)=>{
        setMaterials(prev=>prev.map(m=> m.id===id ? {...m, comments:[...(m.comments||[]), {id:'c-'+Date.now(),author,text,date:new Date().toISOString()}]} : m));
        showToast('Комментарий добавлен','fa-comment');
      };
      const handleDelete = (id)=>{
        if(!confirm('Удалить этот материал из копилки? Действие необратимо.')) return;
        setMaterials(prev=>prev.filter(m=>m.id!==id));
        setViewId(null);
        showToast('Материал удалён','fa-trash-can');
      };
      const handleReset = ()=>{
        if(!confirm('Сбросить все данные и вернуть стартовые примеры? Ваши добавленные материалы будут удалены.')) return;
        localStorage.removeItem(STORAGE_KEY);
        setMaterials(structuredClone(SEED));
        showToast('Данные сброшены к примерам','fa-rotate');
      };

      return (
        <>
          <Header onAdd={()=>setShowAdd(true)} />
          <Hero stats={stats} onAdd={()=>setShowAdd(true)} />
          <FilterBar query={query} setQuery={setQuery} district={district} setDistrict={setDistrict} category={category} setCategory={setCategory} />

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div className="flex items-end justify-between mb-6">
              <div>
                <h2 className="font-display text-2xl sm:text-3xl font-extrabold text-graphite-900">Лента материалов</h2>
                <p className="text-graphite-500 text-sm mt-1">{filtered.length ? `Найдено материалов: ${filtered.length}` : 'Материалы не найдены'}</p>
              </div>
            </div>

            {filtered.length ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filtered.map((m,i)=> <Card key={m.id} m={m} index={i} onOpen={(x)=>setViewId(x.id)} />)}
              </div>
            ) : (
              <div className="text-center py-20">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-sky-50 grid place-items-center text-sky-500 text-3xl"><i className="fa-regular fa-folder-open"></i></div>
                <p className="mt-5 text-lg font-bold text-graphite-800">Ничего не найдено</p>
                <p className="text-graphite-500">Попробуйте изменить фильтры или добавьте первый материал.</p>
                <button onClick={()=>setShowAdd(true)} className="mt-5 inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-sky-600 text-white font-bold hover:bg-sky-700 transition"><i className="fa-solid fa-plus"></i> Добавить материал</button>
              </div>
            )}
          </main>

          <About />
          <Footer onReset={handleReset} />

          {showAdd && <AddModal onClose={()=>setShowAdd(false)} onSubmit={handleAdd} />}
          {viewItem && <ViewModal m={viewItem} onClose={()=>setViewId(null)} onAddComment={handleAddComment} onDelete={handleDelete} onToast={showToast} />}
          <Toast toast={toast} />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
